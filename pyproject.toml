[project]
name = "pyktane"
version = "0.3.0"
description = "Python KTANE utilities."
authors = [
  {name = "Micael Jarniac", email = "micael@jarniac.dev"},
]
license = {text = "MIT"}
readme = "docs/README.md"
classifiers = [
  # Get more from http://pypi.python.org/pypi?%3Aaction=list_classifiers
  "Development Status :: 1 - Planning",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Typing :: Typed",
  # https://github.com/astral-sh/uv/issues/8716
  "License :: OSI Approved :: MIT License",
  # Keep in sync with `requires-python` and `.python-versions`.
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.15",
]

requires-python = ">=3.15"  # py_ver
dependencies = [
    "annotated-types>=0.8.0",
    "loguru>=0.7.3",
    "pydantic>=2.14.1",
]

[project.entry-points."pyktane.packs"]
# Module packs are discovered through this entry point group. Vanilla
# registers itself the same way a third-party (modded) pack would.
vanilla = "pyktane.vanilla:PACK"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
homepage = "https://github.com/MicaelJarniac/pyktane"
source = "https://github.com/MicaelJarniac/pyktane"
download = "https://pypi.org/project/pyktane/#files"
changelog = "https://github.com/MicaelJarniac/pyktane/blob/main/docs/CHANGELOG.md"
documentation = "https://pyktane.readthedocs.io"
issues = "https://github.com/MicaelJarniac/pyktane/issues"

[project.optional-dependencies]
# The MCP server. Run it with `uvx --from 'pyktane[mcp]' pyktane-mcp`.
mcp = [
    "fastmcp>=4.1.0",
]

[project.scripts]
pyktane-mcp = "pyktane.mcp:main"

[dependency-groups]
tests = [
    "anyio>=4",
    "coverage>=7.6.11",
    "hypothesis>=6.125.3",
    "inline-snapshot>=0.20.2",
    "pytest>=8.3.4",
    "pytest-benchmark>=5.1.0",
    "pytest-cov>=6.0.0",
]
benchmarking = [
    "asv>=0.6.4",
    "virtualenv>=20.29.1",
]
docs = [
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.5.2",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-autorefs>=0.5.0",
]
typing = [
    {include-group = "tests"},
    {include-group = "automation"},
    "mypy>=1.15.0",
    # Typing stubs go here
]
linting = [
    "ruff>=0.9.6",
]
pre-commit = [
    "pre-commit>=4.1.0",
]
release = [
    "python-semantic-release>=10.6.1",
]
automation = [
    # 2026.2.9 passes `uv venv --clear`, which uv>=0.10 requires to replace an
    # existing venv. Older nox left the directory for uv to clobber, so every
    # session failed on its second local run.
    "nox[uv]>=2026.2.9",
]
dev = [
    {include-group = "tests"},
    {include-group = "benchmarking"},
    {include-group = "docs"},
    {include-group = "typing"},
    {include-group = "linting"},
    {include-group = "pre-commit"},
    {include-group = "automation"},
    {include-group = "release"},
    "ipython>=8.18.1",
]

[tool.ruff]
# https://docs.astral.sh/ruff/rules/
line-length = 88  # Default
force-exclude = true
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203",
  "D213",
  "COM812",
  "ISC001",
  # Per-file copyright headers: the top-level LICENSE covers the project.
  "CPY001",
]
unfixable = ["ERA001"]

[tool.ruff.lint.per-file-ignores]
# S101: asserts are the point. PLR2004: magic numbers are fixture data.
# S106/S107: "tokens" here are literal test fixtures, not credentials.
# D1: test names say what they check; docstrings are for when they can't.
"tests/*" = ["S101", "PLR2004", "S106", "S107", "D1"]

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["id", "type"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves annotations at runtime, so their imports must stay real.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pyktane.base.Frozen"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
files = ["src", "docs", "tests", "noxfile.py"]
exclude = [".venv"]
enable_error_code = [
  "ignore-without-code"
]
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = false  # true
show_column_numbers = true
# show_error_context = true
# pretty = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
# Keep releasing 0.x. PSR v10 flipped this default to false, which would
# promote the next release to 1.0.0 and declare the API stable.
allow_zero_version = true
# While pre-1.0, a breaking change bumps the minor rather than promoting to
# 1.0.0. This lets a breaking commit be marked honestly with `!` or a
# BREAKING CHANGE footer without accidentally declaring the API stable;
# reaching 1.0.0 stays a deliberate decision.
major_on_zero = false
build_command = """
  pip install uv
  uv lock
  git add uv.lock
  uv build
"""

[tool.semantic_release.changelog]
# PSR v10 changed this default from "init" (rewrite the whole file every
# release) to "update" (splice the new version in at `insertion_flag`). In
# update mode a changelog without the flag is written back byte-for-byte with
# no warning, so releases silently go unrecorded. Both values are pinned so a
# future default change cannot silently do it again, and docs/CHANGELOG.md
# must keep the flag right under its title; tests/test_changelog.py enforces
# that.
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.changelog.default_templates]
changelog_file = "docs/CHANGELOG.md"

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.branches.rc]
match = "rc"
prerelease = true
prerelease_token = "rc"

[tool.coverage.run]
source = ["src"]
command_line = "-m pytest"
# Line coverage alone reports a line green even when only one side of a
# conditional on it ever runs. Branches catch that.
branch = true

[tool.coverage.report]
# The bar is 100% (docs/CONTRIBUTING.md), so make `pytest --cov` say so
# instead of leaving it to Codecov to notice after the fact.
fail_under = 100
show_missing = true

[tool.pytest.ini_options]
# addopts = "--cov"
# Docstring examples are part of the docs; keep them running.
addopts = "--doctest-modules"
testpaths = ["tests", "src"]
filterwarnings = [
  # Unclosed resources (files, sockets, database connections) left to the
  # garbage collector surface as a ResourceWarning at finalization. Both lines
  # are needed to fail the run: the warning is raised inside a finalizer,
  # where it cannot propagate, so Python hands it to `sys.unraisablehook` and
  # pytest re-reports it as PytestUnraisableExceptionWarning.
  "error::ResourceWarning",
  "error::pytest.PytestUnraisableExceptionWarning",
  # Upstream, in FastMCP's dependencies (beartype checking key-value's
  # non-runtime-checkable protocol); nothing for us to fix.
  "ignore:<class 'key_value.aio.protocols:DeprecationWarning:beartype",
]

[tool.inline-snapshot]
format-command = "ruff format --stdin-filename {filename}"

[tool.cruft]
skip = [
  "src",
  "tests",
  "benchmarks",
  ".asv",
  "uv.lock",
]
