# tests/manual/ holds byte-for-byte copies of the official manual: never
# "fix" them, or they stop being what Steel Crate Games published.
exclude: ^tests/manual/
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 'v5.0.0'
    hooks:
    -   id: check-toml
    -   id: check-yaml
        exclude: ^mkdocs\.yml$
    -   id: check-json
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
    -   id: requirements-txt-fixer
